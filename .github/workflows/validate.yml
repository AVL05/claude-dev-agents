name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Validate Markdown resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Markdown files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.md' -not -path './.git/*')
          test -n "$files"
          while IFS= read -r file; do
            test -s "$file"
          done <<< "$files"
